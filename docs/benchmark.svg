<svg xmlns="http://www.w3.org/2000/svg" width="880" height="704" viewBox="0 0 880 704" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#1B212B"/><line x1="0" y1="0" x2="0" y2="8" stroke="#5C6678" stroke-width="3"/></pattern>
    <linearGradient id="spark" x1="0" x2="1"><stop offset="0" stop-color="#FF4D00"/><stop offset="1" stop-color="#FFB020"/></linearGradient>
    <style>
      .lbl{font-size:15px;font-weight:600;fill:#E8ECF3}
      .sub{font-size:12px;fill:#8B95A7}
      .val{font-size:15px;font-weight:700;fill:#FFFFFF}
      .gain{font-weight:500;fill:#FFB020}
    </style>
  </defs>
  <rect width="880" height="704" rx="18" fill="#0E1116"/>
  <text x="32" y="48" font-size="22" font-weight="800" fill="#FFFFFF">Same 5-step task, median of 10 runs</text>
  <text x="32" y="76" font-size="13.5" fill="#8B95A7">Fill a field, tick a box, change page, click a client-rendered button that calls an API, wait for the result.</text>
  <text x="32" y="95" font-size="13.5" fill="#8B95A7">Tool-side wall time. Every extra tool call also costs one LLM turn, which is not included here.</text>
  
  <text x="284" y="134" text-anchor="end" class="lbl">Playwright MCP (1 action / call)</text>
  <text x="284" y="152" text-anchor="end" class="sub">7 tool calls (model turns)</text>
  <rect x="300" y="120" width="470.0" height="30" rx="7" fill="#8B95A7" opacity="0.85"/>
  <text x="780" y="141" class="val">2,181 ms<tspan class="gain"></tspan></text>
  <text x="284" y="192" text-anchor="end" class="lbl">Chrome DevTools MCP (1 action / call)</text>
  <text x="284" y="210" text-anchor="end" class="sub">8 tool calls (model turns)</text>
  <rect x="300" y="178" width="266.8" height="30" rx="7" fill="#8B95A7" opacity="0.85"/>
  <text x="576.7858780375974" y="199" class="val">1,238 ms<tspan class="gain"> · 1.8× faster</tspan></text>
  <text x="284" y="250" text-anchor="end" class="lbl">agent-browser (1 action / call)</text>
  <text x="284" y="268" text-anchor="end" class="sub">7 tool calls (model turns)</text>
  <rect x="300" y="236" width="126.3" height="30" rx="7" fill="#8B95A7" opacity="0.85"/>
  <text x="436.2815222375057" y="257" class="val">586 ms<tspan class="gain"> · 3.7× faster</tspan></text>
  <text x="284" y="308" text-anchor="end" class="lbl">agent-browser flow run (API)</text>
  <text x="284" y="326" text-anchor="end" class="sub">1 tool call (model turn)</text>
  <rect x="300" y="294" width="6.0" height="30" rx="7" fill="#8B95A7" opacity="0.85"/>
  <text x="316.033929390188" y="315" class="val">28 ms<tspan class="gain"> · 77.9× faster</tspan></text>
  <text x="284" y="366" text-anchor="end" class="lbl">Flintrail live (1 action / call)</text>
  <text x="284" y="384" text-anchor="end" class="sub">7 tool calls (model turns)</text>
  <rect x="300" y="352" width="153.2" height="30" rx="7" fill="#FF7A2F" opacity="1"/>
  <text x="463.2187070151307" y="373" class="val">711 ms<tspan class="gain"> · 3.1× faster</tspan></text>
  <text x="284" y="424" text-anchor="end" class="lbl">Flintrail live, batched</text>
  <text x="284" y="442" text-anchor="end" class="sub">3 tool calls (model turns)</text>
  <rect x="300" y="410" width="136.4" height="30" rx="7" fill="#FF7A2F" opacity="1"/>
  <text x="446.40990371389273" y="431" class="val">633 ms<tspan class="gain"> · 3.4× faster</tspan></text>
  <text x="284" y="482" text-anchor="end" class="lbl">Flintrail replay (fl_run)</text>
  <text x="284" y="500" text-anchor="end" class="sub">2 tool calls (model turns)</text>
  <rect x="300" y="468" width="133.2" height="30" rx="7" fill="#FF7A2F" opacity="1"/>
  <text x="443.1774415405777" y="489" class="val">618 ms<tspan class="gain"> · 3.5× faster</tspan></text>
  <text x="284" y="540" text-anchor="end" class="lbl">Flintrail API replay (fl_run)</text>
  <text x="284" y="558" text-anchor="end" class="sub">2 tool calls (model turns)</text>
  <rect x="300" y="526" width="12.1" height="30" rx="7" fill="url(#spark)" opacity="1"/>
  <text x="322.06785878037596" y="547" class="val">56 ms<tspan class="gain"> · 38.9× faster</tspan></text>
  <text x="284" y="598" text-anchor="end" class="lbl">Plain Playwright script</text>
  <text x="284" y="616" text-anchor="end" class="sub">reference</text>
  <rect x="300" y="584" width="204.5" height="30" rx="7" fill="url(#hatch)" opacity="0.85"/>
  <text x="514.5071068317286" y="605" class="val">949 ms<tspan class="gain"> · no MCP, no agent</tspan></text>
  <text x="32" y="678" font-size="12" fill="#5C6678">Measured 2026-11-23 · Node v25.0.0 · headless Chromium · bench/bench.mjs reproduces it</text>
</svg>
