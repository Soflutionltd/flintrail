<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8B95A7"/>
    </marker>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FF4D00"/><stop offset="1" stop-color="#FFB020"/></linearGradient>
    <style>
      .box{fill:#161B22;stroke:#2B3340;stroke-width:1.5}
      .hot{fill:#1E1610;stroke:#FF6A1A;stroke-width:1.5}
      .t{font-size:15px;font-weight:700;fill:#E8ECF3}
      .s{font-size:11.8px;fill:#8B95A7}
      .w{stroke:#8B95A7;stroke-width:1.6;fill:none}
      .k{font-size:11.5px;fill:#FFB020;font-weight:600}
    </style>
  </defs>
  <rect width="900" height="520" rx="18" fill="#0E1116"/>

  <!-- Agents -->
  <rect class="box" x="30" y="40" width="200" height="190" rx="12"/>
  <text class="t" x="50" y="70">AI agents</text>
  <text class="s" x="50" y="96">Claude Desktop / Code</text>
  <text class="s" x="50" y="118">Cursor, Windsurf</text>
  <text class="s" x="50" y="140">Hermes, OpenClaw</text>
  <text class="s" x="50" y="162">any MCP client</text>
  <text class="k" x="50" y="200">stdio · HTTP + bearer token</text>

  <path class="w" d="M230 135 H300" marker-end="url(#a)"/>

  <!-- Flintrail core -->
  <rect x="300" y="30" width="340" height="400" rx="14" fill="none" stroke="url(#g)" stroke-width="2"/>
  <text x="322" y="60" font-size="18" font-weight="800" fill="#FF6A1A">Flintrail</text>

  <rect class="hot" x="322" y="78" width="306" height="70" rx="10"/>
  <text class="t" x="340" y="104">Live engine</text>
  <text class="s" x="340" y="126">compact snapshots · batched actions · smart waits</text>

  <rect class="box" x="322" y="160" width="306" height="70" rx="10"/>
  <text class="t" x="340" y="186">Recorder</text>
  <text class="s" x="340" y="208">multi-clue element fingerprints · {{variables}}</text>

  <rect class="hot" x="322" y="242" width="306" height="70" rx="10"/>
  <text class="t" x="340" y="268">Replayer</text>
  <text class="s" x="340" y="290">no LLM · parallel runs · stops cleanly to repair</text>

  <rect class="box" x="322" y="324" width="306" height="80" rx="10"/>
  <text class="t" x="340" y="350">Network capture</text>
  <text class="s" x="340" y="372">sees the site's own API calls, replays them</text>
  <text class="s" x="340" y="390">from inside the page with your session</text>

  <!-- Browser -->
  <path class="w" d="M640 160 H700" marker-end="url(#a)"/>
  <rect class="box" x="700" y="70" width="170" height="180" rx="12"/>
  <text class="t" x="718" y="100">Browser</text>
  <text class="s" x="718" y="126">attach: Chrome for</text>
  <text class="s" x="718" y="144">Testing over CDP,</text>
  <text class="s" x="718" y="162">your logged-in sessions</text>
  <text class="s" x="718" y="190">launch: headless</text>
  <text class="s" x="718" y="208">Chromium (servers, CI)</text>
  <text class="k" x="718" y="236">never a personal browser</text>

  <!-- Store -->
  <path class="w" d="M640 300 H700" marker-end="url(#a)"/>
  <rect class="box" x="700" y="270" width="170" height="110" rx="12"/>
  <text class="t" x="718" y="300">Flow store</text>
  <text class="s" x="718" y="326">~/.flintrail/flows</text>
  <text class="s" x="718" y="346">plain JSON, versionable</text>
  <text class="s" x="718" y="366">no passwords, ever</text>

  <!-- Speed ladder -->
  <text class="s" x="30" y="470">Speed ladder:</text>
  <text x="125" y="470" font-size="13" fill="#E8ECF3">live, one action per call  →  live, batched  →  replay  →  <tspan font-weight="800" fill="#FFB020">API replay</tspan></text>
  <text class="s" x="30" y="494">Each step to the right removes LLM turns and browser work. Record a task once and every later run starts at the right.</text>
</svg>
