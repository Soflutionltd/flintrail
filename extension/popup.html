<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 328px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #c7c7cc; box-shadow: 0 0 0 3px rgb(0 0 0 / 0.04); }
  #dot.connected { background: var(--on); box-shadow: 0 0 0 3px rgb(52 199 89 / 0.18); }
  #dot.connecting { background: #ff9f0a; box-shadow: 0 0 0 3px rgb(255 159 10 / 0.18); }
  #dot.error { background: var(--danger); box-shadow: 0 0 0 3px rgb(215 0 21 / 0.15); }
  .content { padding: 0 12px 4px; }
  .group { margin-bottom: 14px; }
  .group > h2 { font-size: 12px; margin-bottom: 6px; }
  .line { display: flex; gap: 8px; align-items: center; }
  .line + .line { margin-top: 8px; }
  .line input.port { width: 72px; flex: none; }
  .line button { flex: 1; }
  .line button.fit { flex: none; }
  #recinfo { margin-top: 6px; font-size: 12px; font-weight: 500; color: var(--danger); }
  #recinfo:empty { display: none; }
  .tools { display: flex; align-items: center; gap: 10px; }
  button.icon { width: 30px; height: 30px; padding: 0; border-radius: 50%; background: transparent; color: var(--ink-soft); }
  button.icon:hover { background: var(--fill); color: var(--ink); }
  button.icon svg { width: 18px; height: 18px; }
  footer { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 16px 14px; font-size: 12px; color: var(--ink-muted); }
</style>
</head>
<body>
  <header>
    <div class="brand"><img src="icons/48.png" alt="" draggable="false"><b>Flintrail</b></div>
    <div class="tools">
      <div id="dot" title="status" role="img" aria-label="Connection status"></div>
      <button id="settings" type="button" class="icon" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
  </header>

  <div class="content">
    <section class="group" id="connectBox">
      <h2>Connection</h2>
      <div class="card block">
        <div class="line"><input id="token" type="password" placeholder="Token (optional, paired automatically)" autocomplete="off"><input id="port" class="port" placeholder="8932"></div>
        <div class="line"><button id="connect" class="primary">Connect</button><button id="disconnect" class="hidden">Disconnect</button></div>
        <div id="status" class="status"></div>
      </div>
    </section>

    <section class="group">
      <h2>Name of this browser</h2>
      <div class="card block">
        <div class="line"><input id="label" placeholder="e.g. Work, Personal" maxlength="60" autocomplete="off"><button id="saveLabel" class="fit">Save</button></div>
        <div id="nameInfo" class="status"></div>
      </div>
    </section>

    <section class="group">
      <h2>Agent</h2>
      <div class="card block">
        <div class="line"><button id="agentWindow">Keep the agent to this window</button></div>
        <div id="windowInfo" class="status"></div>
        <div class="line"><button id="share">Share with agent</button></div>
      </div>
    </section>

    <section class="group">
      <h2>Teach by demonstration</h2>
      <div class="card block">
        <div class="line"><input id="flow" placeholder="Flow name, e.g. renew-parking"></div>
        <div class="line"><button id="recStart" class="record">Start recording</button><button id="recStop" class="hidden">Stop and save</button></div>
        <div id="recinfo"></div>
        <div id="msg" class="status"></div>
      </div>
    </section>
  </div>

  <footer><span>Passwords are never recorded.</span><a href="https://github.com/Soflutionltd/flintrail" target="_blank" rel="noopener">Docs</a></footer>
  <script src="popup.js"></script>
</body>
</html>
