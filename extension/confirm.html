<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flintrail: your answer</title>
<style>
  :root { --bg:#0E1116; --card:#161B23; --line:#262E3B; --text:#E8ECF2; --muted:#8B95A7; --accent:#FF6A1A; }
  * { box-sizing:border-box; }
  body { margin:0; padding:18px; background:var(--bg); color:var(--text); font:14px/1.5 Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  h1 { font-size:16px; margin:0 0 12px; } h1 span { color:var(--accent); }
  dl { margin:0 0 16px; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; }
  dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
  /* The answer stays in view, whatever the text above it or the browser's own bar take. */
  .row { display:flex; gap:8px; position:sticky; bottom:0; padding:8px 0; background:var(--bg); }
  button { flex:1; padding:10px; border:0; border-radius:8px; font:600 14px inherit; font-family:inherit; cursor:pointer; }
  #allow { background:var(--accent); color:var(--bg); } #deny { background:transparent; border:1px solid var(--line); color:var(--text); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button:disabled { opacity:.5; cursor:default; }
  p { color:var(--muted); font-size:12px; margin:10px 0 0; }
</style>
</head>
<body>
  <h1><span>Flintrail</span> wants to fill a saved login</h1>
  <dl><dt id="l-domain">Website</dt><dd id="domain"></dd><dt id="l-item">Login</dt><dd id="item"></dd><dt id="l-fields">Fields</dt><dd id="fields"></dd></dl>
  <div class="row"><button id="deny" type="button" disabled>Refuse</button><button id="allow" type="button" disabled>Allow</button></div>
  <p id="note">The agent never sees the password. No answer within 2 minutes means no.</p>
<script src="confirm.js"></script>
</body>
</html>
