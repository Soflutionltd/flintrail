<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rocketwright: your answer</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { padding: 22px 20px 0; background: var(--page); }
  .brand { margin-bottom: 14px; }
  .brand img { width: 22px; height: 22px; }
  .brand b { font-size: 13px; color: var(--ink-muted); font-weight: 500; }
  h1 { margin: 0 0 16px; font-size: 17px; font-weight: 600; line-height: 1.3; letter-spacing: -0.02em; text-wrap: balance; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; }
  dt, dd { padding: 10px 14px; }
  dt { color: var(--ink-muted); }
  dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
  dt + dd ~ dt, dt + dd ~ dt + dd { border-top: 0.5px solid var(--hairline); }
  /* The answer stays in view, whatever the text above it or the browser's own bar take. */
  .answer { position: sticky; bottom: 0; display: flex; gap: 10px; margin: 0 -20px; padding: 16px 20px 18px; background: linear-gradient(to top, var(--page) 78%, rgb(245 245 247 / 0)); }
  .answer button { flex: 1; padding: 10px 14px; font-size: 14px; }
  p#note { margin: 14px 0 0; font-size: 12px; color: var(--ink-muted); }
</style>
</head>
<body>
  <div class="brand"><img src="icons/48.png" alt="" draggable="false"><b>Rocketwright</b></div>
  <h1>Rocketwright wants to fill a saved login</h1>
  <div class="card"><dl><dt id="l-domain">Website</dt><dd id="domain"></dd><dt id="l-item">Login</dt><dd id="item"></dd><dt id="l-fields">Fields</dt><dd id="fields"></dd></dl></div>
  <p id="note">The agent never sees the password. No answer within 2 minutes means no.</p>
  <div class="answer"><button id="deny" type="button" disabled>Refuse</button><button id="allow" type="button" class="primary" disabled>Allow</button></div>
<script src="confirm.js"></script>
</body>
</html>
