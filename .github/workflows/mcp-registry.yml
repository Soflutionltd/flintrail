# Builds the .mcpb bundle, attaches it to the GitHub release and publishes the server
# to the official MCP Registry (registry.modelcontextprotocol.io) as io.github.Soflutionltd/flintrail.
# Runs on every v* tag, or by hand for an existing tag.
name: MCP Registry

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to bundle and publish (for example v1.2.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Use the packaging files of the default branch
        run: git checkout ${{ github.sha }} -- .mcp scripts/build-mcpb.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: |
          npm ci
          npm run build --if-present

      - name: Bundle
        run: |
          node scripts/build-mcpb.mjs "$TAG"
          mv flintrail-*.mcpb flintrail.mcpb
          echo "SHA=$(sha256sum flintrail.mcpb | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Attach to the release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "flintrail $TAG" --generate-notes
          gh release upload "$TAG" flintrail.mcpb --clobber

      - name: Write server.json
        run: |
          jq --arg v "${TAG#v}" --arg u "https://github.com/${{ github.repository }}/releases/download/$TAG/flintrail.mcpb" --arg s "$SHA" \
            '.version=$v | .packages[0].identifier=$u | .packages[0].fileSha256=$s' .mcp/server.json > server.json
          cat server.json

      - name: Publish to the MCP Registry
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
