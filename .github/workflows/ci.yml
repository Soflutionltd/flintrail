name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes under two minutes; without a limit a hung test holds the runner for six hours.
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Relay logs of the failed run
        if: failure()
        run: |
          for f in /tmp/rocketwright-*/relay.log; do [ -f "$f" ] && { echo "== $f"; cat "$f"; }; done; true
